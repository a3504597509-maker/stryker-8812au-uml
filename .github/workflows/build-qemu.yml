name: build-8812au-qemu

on:
  workflow_dispatch:
    inputs:
      driver_ref:
        description: "aircrack-ng/rtl8812au branch or tag"
        required: true
        default: "v5.6.4.2"
      full_kernel:
        description: "1 = build whole kernel, 0 = use symvers.txt dumped from the device"
        required: true
        default: "0"

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc flex bison libelf-dev \
            libssl-dev git curl xz-utils kmod zip
          uname -m
          gcc --version | head -1

      - name: Fetch kernel source
        run: |
          set -euo pipefail
          git clone --depth=1 -b um-arm64 \
            https://github.com/zalexdev/linux-um-arm64.git kernel
          cd kernel
          if [ "$(git rev-parse HEAD)" != "8897487c52233cd00cf2850008ca068892f1ae91" ]; then
            git fetch --depth=1 origin 8897487c52233cd00cf2850008ca068892f1ae91
            git checkout FETCH_HEAD
          fi
          git log -1 --format='HEAD %H%n%s'

      - name: Configure
        run: |
          set -euo pipefail
          cd kernel
          cp "$GITHUB_WORKSPACE/kernel.config" .config
          ./scripts/config --set-str LOCALVERSION "-g8897487c5223"
          ./scripts/config --disable LOCALVERSION_AUTO
          make ARCH=arm64 olddefconfig
          touch .scmversion
          grep -E '^CONFIG_(USB=|CFG80211=|MAC80211=|USBIP_VHCI_HCD=|MODVERSIONS=|MODULE_SIG=|LOCALVERSION=)' .config || true
          make ARCH=arm64 kernelrelease

      - name: Prepare kernel tree
        run: |
          set -euo pipefail
          cd kernel
          if [ "${{ inputs.full_kernel }}" = "1" ]; then
            make ARCH=arm64 -j"$(nproc)"
            echo "Module.symvers from full build: $(wc -l < Module.symvers)"
          else
            make ARCH=arm64 modules_prepare
            cp "$GITHUB_WORKSPACE/symvers.txt" Module.symvers
            echo "Module.symvers from device dump: $(wc -l < Module.symvers)"
          fi
          grep -E 'wiphy_new_nm|wiphy_register|usb_register_driver' Module.symvers | head -5 || true

      - name: Fetch driver
        run: |
          set -euo pipefail
          git clone --depth=1 -b "${{ inputs.driver_ref }}" \
            https://github.com/aircrack-ng/rtl8812au.git driver
          cd driver
          git log -1 --format='driver %H %s'

      - name: Patch driver for 7.2
        run: |
          set -euo pipefail
          cd driver
          sed -i 's/EXTRA_CFLAGS/ccflags-y/g; s/EXTRA_LDFLAGS/ldflags-y/g' Makefile
          echo "ccflags-y lines: $(grep -c 'ccflags-y' Makefile)"
          # rtw_br_ext is the NAT25 bridge helper for WISP mode. It pokes
          # struct pppoe_hdr/pppoe_tag, whose flexible-array members are gone
          # from the kernel build in 7.x. Monitor + injection never touch it,
          # so drop it instead of rewriting the PPPoE parsing.
          sed -i 's/^CONFIG_BR_EXT = y/CONFIG_BR_EXT = n/' Makefile
          echo "CONFIG_BR_EXT = $(grep -m1 '^CONFIG_BR_EXT' Makefile)"
          printf '%s\n' \
            '#ifndef RTW_COMPAT_7X_H' \
            '#define RTW_COMPAT_7X_H' \
            '#include <linux/version.h>' \
            '#ifndef from_timer' \
            '#define from_timer(var, callback_timer, timer_fieldname) timer_container_of(var, callback_timer, timer_fieldname)' \
            '#endif' \
            '#ifndef del_timer_sync' \
            '#define del_timer_sync(t) timer_delete_sync(t)' \
            '#endif' \
            '#ifndef del_timer' \
            '#define del_timer(t) timer_delete(t)' \
            '#endif' \
            '#endif' > include/rtw_compat_7x.h
          sed -i '1i #include "rtw_compat_7x.h"' include/osdep_service_linux.h
          head -3 include/osdep_service_linux.h
          cat include/rtw_compat_7x.h

      - name: Build module
        run: |
          set -o pipefail
          cd driver
          make ARCH=arm64 KSRC="$GITHUB_WORKSPACE/kernel" \
            -j"$(nproc)" 2>&1 | tee build.log
          ls -la ./*.ko

      - name: Verify module
        run: |
          set -euo pipefail
          cd driver
          KO=$(ls ./*.ko | head -1)
          echo "=== modinfo $KO ==="
          modinfo "$KO" | head -30
          echo "=== target vermagic ==="
          echo "7.2.0-rc4-g8897487c5223 SMP preempt mod_unload modversions aarch64"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$KO" "$GITHUB_WORKSPACE/out/"

      - name: Pack
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/out"
          tar czf "$GITHUB_WORKSPACE/8812au-qemu-aarch64.tar.gz" .
          sha256sum "$GITHUB_WORKSPACE/8812au-qemu-aarch64.tar.gz"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 8812au-qemu-aarch64
          path: |
            ${{ github.workspace }}/8812au-qemu-aarch64.tar.gz
            ${{ github.workspace }}/driver/build.log
          retention-days: 30
