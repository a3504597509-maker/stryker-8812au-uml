name: build-8812au-uml

on:
  workflow_dispatch:
    inputs:
      driver_ref:
        description: "aircrack-ng/rtl8812au branch or tag"
        required: true
        default: "v5.6.4.2"

jobs:
  build:
    # The UML guest kernel is an aarch64 userspace binary, so build natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc flex bison libelf-dev \
            libssl-dev git curl xz-utils kmod zip
          uname -m
          gcc --version | head -1

      - name: Fetch kernel source
        run: |
          set -euo pipefail
          git clone --depth=1 -b um-arm64 \
            https://github.com/zalexdev/linux-um-arm64.git kernel
          cd kernel
          if [ "$(git rev-parse HEAD)" != "32e5e10b81d8882bdaf77b71e4106a941840c750" ]; then
            git fetch --depth=1 origin 32e5e10b81d8882bdaf77b71e4106a941840c750
            git checkout FETCH_HEAD
          fi
          git log -1 --format='HEAD %H%n%s'

      - name: Configure
        run: |
          set -euo pipefail
          cd kernel
          cp "$GITHUB_WORKSPACE/uml.config" .config
          ./scripts/config --set-str LOCALVERSION "-g32e5e10b81d8"
          ./scripts/config --disable LOCALVERSION_AUTO
          make ARCH=um SUBARCH=arm64 olddefconfig
          grep -E '^CONFIG_(UML|64BIT|CFG80211|MAC80211|USBIP_VHCI_HCD|MODVERSIONS|MODULE_SIG|TRIM_UNUSED_KSYMS|LOCALVERSION)=' .config || true

      - name: Prepare kernel tree
        run: |
          set -euo pipefail
          cd kernel
          # Commit the generated tree FIRST: setlocalversion appends "+" while
          # git status is dirty, and that "+" ends up inside kernel.release and
          # therefore inside every module's vermagic.
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -m "prepared tree" --no-verify || true
          echo "dirty before release: $(git status --porcelain | wc -l)"
          rm -f include/config/kernel.release include/generated/utsrelease.h
          make ARCH=um SUBARCH=arm64 kernelrelease
          echo "UTS_RELEASE: $(cat include/config/kernel.release)"
          make ARCH=um SUBARCH=arm64 modules_prepare
          git add -A
          git -c user.email=ci@local -c user.name=ci commit -m "modules_prepare" --no-verify || true
          echo "dirty after: $(git status --porcelain | wc -l)"

      - name: Fetch driver
        run: |
          set -euo pipefail
          git clone --depth=1 -b "${{ inputs.driver_ref }}" \
            https://github.com/aircrack-ng/rtl8812au.git driver
          cd driver
          git log -1 --format='driver %H %s'

      - name: Patch driver for 7.2
        run: |
          set -euo pipefail
          cd driver
          sed -i 's/EXTRA_CFLAGS/ccflags-y/g; s/EXTRA_LDFLAGS/ldflags-y/g' Makefile
          echo "ccflags-y lines: $(grep -c 'ccflags-y' Makefile)"

          sed -i 's/^CONFIG_BR_EXT = y/CONFIG_BR_EXT = n/' Makefile
          echo "CONFIG_BR_EXT = $(grep -m1 '^CONFIG_BR_EXT' Makefile)"

          # ARCH=um SUBARCH=arm64 pulls arch/arm64/include/asm/string.h, which
          # defines __HAVE_ARCH_MEMCPY and friends. lib/string.c then compiles
          # those out, so no EXPORT_SYMBOL exists and an out-of-tree module
          # dies with "Unknown symbol memcpy (err -2)". Build local copies.
          cp ../rtw_libc_shim.c os_dep/linux/rtw_libc_shim.c
          sed -i '/^obj-\$(CONFIG_88XXAU)/i $(MODULE_NAME)-y += os_dep/linux/rtw_libc_shim.o' Makefile
          echo "shim in objs:"; grep -n 'rtw_libc_shim' Makefile

          grep -rl --include='*.c' --include='*.h' -e strncpy -e strlcpy . | \
            xargs -r sed -i 's/\bstrncpy\b/strscpy/g; s/\bstrlcpy\b/strscpy/g'
          grep -rl --include='*.c' --include='*.h' '#define strscpy strscpy' . | \
            xargs -r sed -i '/^#define strscpy strscpy$/d'

          sed -i 's/^#ccflags-y += -Wno-error=incompatible-pointer-types/ccflags-y += -Wno-error=incompatible-pointer-types/' Makefile
          grep -n 'incompatible-pointer-types' Makefile | head -2

          printf '%s\n' \
            '#ifndef RTW_COMPAT_7X_H' \
            '#define RTW_COMPAT_7X_H' \
            '#include <linux/version.h>' \
            '#include <linux/string.h>' \
            '#include <linux/timer.h>' \
            '#ifndef from_timer' \
            '#define from_timer(var, callback_timer, timer_fieldname) timer_container_of(var, callback_timer, timer_fieldname)' \
            '#endif' \
            '#ifndef del_timer_sync' \
            '#define del_timer_sync(t) timer_delete_sync(t)' \
            '#endif' \
            '#ifndef del_timer' \
            '#define del_timer(t) timer_delete(t)' \
            '#endif' \
            '#endif' > include/rtw_compat_7x.h
          sed -i '1i #include "rtw_compat_7x.h"' include/osdep_service_linux.h
          head -2 include/osdep_service_linux.h

      - name: Build module
        run: |
          set -o pipefail
          cd driver
          # CONFIG_MODVERSIONS is off in this kernel, so unresolved symbol
          # warnings are expected here; the running kernel resolves them by
          # name at insmod time.
          make ARCH=um SUBARCH=arm64 KSRC="$GITHUB_WORKSPACE/kernel" \
            KBUILD_MODPOST_WARN=1 -j"$(nproc)" 2>&1 | tee build.log
          ls -la ./*.ko

      - name: Verify module
        run: |
          set -euo pipefail
          cd driver
          KO=$(ls ./*.ko | head -1)
          echo "=== modinfo $KO ==="
          modinfo "$KO" | head -30
          echo "=== target vermagic ==="
          echo "7.2.0-rc4-g32e5e10b81d8"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$KO" "$GITHUB_WORKSPACE/out/"

      - name: Pack
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/out"
          tar czf "$GITHUB_WORKSPACE/8812au-uml-aarch64.tar.gz" .
          sha256sum "$GITHUB_WORKSPACE/8812au-uml-aarch64.tar.gz"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 8812au-uml-aarch64
          path: |
            ${{ github.workspace }}/8812au-uml-aarch64.tar.gz
            ${{ github.workspace }}/driver/build.log
          retention-days: 30
