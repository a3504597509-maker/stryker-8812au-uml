name: build-8812au-uml

on:
  workflow_dispatch:
    inputs:
      kernel_commit:
        description: "linux-um-arm64 commit (must match the running libuml.so)"
        required: true
        default: "32e5e10b81d8882bdaf77b71e4106a941840c750"
      driver_ref:
        description: "aircrack-ng/rtl8812au branch or tag"
        required: true
        default: "v5.6.4.2"
      localversion:
        description: "localversion injected into vermagic"
        required: true
        default: "-g32e5e10b81d8"
      full_kernel:
        description: "1 = build whole kernel (slow), 0 = modules_prepare only"
        required: true
        default: "0"

jobs:
  build:
    # Native arm64: the UML kernel is an aarch64 userspace binary.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential bc flex bison libelf-dev \
            libssl-dev git curl xz-utils kmod zip
          uname -m
          gcc --version | head -1

      - name: Fetch kernel source
        run: |
          set -euo pipefail
          git clone --depth=1 -b um-arm64 \
            https://github.com/zalexdev/linux-um-arm64.git kernel
          cd kernel
          HEAD_SHA=$(git rev-parse HEAD)
          echo "branch head: $HEAD_SHA"
          if [ "$HEAD_SHA" != "${{ inputs.kernel_commit }}" ]; then
            echo "head moved, fetching pinned commit"
            git fetch --depth=1 origin "${{ inputs.kernel_commit }}"
            git checkout FETCH_HEAD
          fi
          git log -1 --format='HEAD %H%n%s'

      - name: Configure
        run: |
          set -euo pipefail
          cd kernel
          cp "$GITHUB_WORKSPACE/uml.config" .config
          ./scripts/config --set-str LOCALVERSION "${{ inputs.localversion }}"
          ./scripts/config --disable LOCALVERSION_AUTO
          ./scripts/config --disable MODVERSIONS
          ./scripts/config --disable MODULE_SIG
          ./scripts/config --disable TRIM_UNUSED_KSYMS
          make ARCH=um SUBARCH=arm64 olddefconfig
          grep -E '^CONFIG_(UML|CFG80211|MAC80211|USBIP_VHCI_HCD|MODVERSIONS|MODULE_SIG|LOCALVERSION)=' .config
          make ARCH=um SUBARCH=arm64 kernelrelease

      - name: Prepare tree
        run: |
          set -euo pipefail
          cd kernel
          if [ "${{ inputs.full_kernel }}" = "1" ]; then
            make ARCH=um SUBARCH=arm64 -j"$(nproc)"
            test -s Module.symvers
            echo "Module.symvers: $(wc -l < Module.symvers)"
          else
            make ARCH=um SUBARCH=arm64 modules_prepare
            echo "modules_prepare done (MODVERSIONS off, Module.symvers not required)"
          fi

      - name: Fetch driver
        run: |
          set -euo pipefail
          git clone --depth=1 -b "${{ inputs.driver_ref }}" \
            https://github.com/aircrack-ng/rtl8812au.git driver
          cd driver
          git log -1 --format='driver %H %s'

      - name: Build module
        run: |
          set -o pipefail
          cd driver
          # Linux 7.2 dropped EXTRA_CFLAGS from scripts/Makefile.lib; the driver
          # still puts every -I and -DCONFIG_RTL8812A there, so without this the
          # compile dies on drv_types.h and then builds empty stubs.
          sed -i 's/\bEXTRA_CFLAGS\b/ccflags-y/g; s/\bEXTRA_LDFLAGS\b/ldflags-y/g' Makefile
          echo "ccflags-y lines: $(grep -c 'ccflags-y' Makefile)"
          make ARCH=um SUBARCH=arm64 KSRC="$GITHUB_WORKSPACE/kernel" \
            -j"$(nproc)" 2>&1 | tee build.log
          ls -la ./*.ko

      - name: Verify module
        run: |
          set -euo pipefail
          cd driver
          KO=$(ls ./*.ko | head -1)
          echo "=== modinfo $KO ==="
          modinfo "$KO" | head -30
          echo "=== expected vermagic prefix ==="
          echo "7.2.0-rc4${{ inputs.localversion }}"
          echo "=== symbol deps ==="
          modinfo -F depends "$KO" || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$KO" "$GITHUB_WORKSPACE/out/"

      - name: Pack
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/out"
          tar czf "$GITHUB_WORKSPACE/8812au-uml-aarch64.tar.gz" .
          sha256sum "$GITHUB_WORKSPACE/8812au-uml-aarch64.tar.gz"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 8812au-uml-aarch64
          path: |
            ${{ github.workspace }}/8812au-uml-aarch64.tar.gz
            ${{ github.workspace }}/driver/build.log
          retention-days: 30
